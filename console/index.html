<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARA: Deception — Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/style.css"></head>
<body>
<canvas id="world"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="i-hex"><path d="M8 1.5 14 5v6l-6 3.5L2 11V5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></g>
  <g id="i-eye"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8" cy="8" r="2" fill="currentColor"/></g>
  <g id="i-rule"><path d="M3 13.5 13 3.5M5 3.5h8v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="i-tag"><path d="M2 2h6l6 6-6 6-6-6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="5.6" cy="5.6" r="1.4" fill="currentColor"/></g>
  <g id="i-box"><path d="M2 5.5 8 2l6 3.5v5L8 14l-6-3.5zM2 5.5 8 9l6-3.5M8 9v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></g>
  <g id="i-compass"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.5 5.5 9 9l-3.5 1.5L7 7z" fill="currentColor"/></g>
  <g id="i-crown"><path d="M2.5 11.5 3.5 5l3 2.6L8 3.5 9.5 7.6l3-2.6 1 6.5z" fill="currentColor"/></g>
  <g id="i-play"><path d="M4 2.8v10.4L13 8z" fill="currentColor"/></g>
</defs></svg>

<div id="tipbox" hidden></div>

<div id="login" hidden><div class="card login-card">
  <div class="logo-row"><span class="hexmark"></span><h2>MARA: Deception</h2></div>
  <p class="hint">Whitelist logins only. Ask Shreya for an account.</p>
  <label>Name</label><input id="li-name" style="width:100%" autocomplete="username">
  <label style="margin-top:12px">Password</label>
  <input id="li-pass" type="password" style="width:100%" autocomplete="current-password">
  <p id="li-err" class="err" hidden>Wrong name or password.</p>
  <button class="primary" style="margin-top:14px" onclick="doLogin()">Enter the arena</button>
</div></div>

<div class="shell">
<header>
  <div class="logo-row"><span class="hexmark big"></span>
    <div><div class="brand">MARA: Deception</div>
      <div class="tagline">Catanist console · say one thing, the engine remembers what you did</div></div></div>
  <div class="spacer"></div>
  <span id="who" class="chip"></span>
  <button class="ghost" onclick="logout()">Log out</button>
</header>
<nav id="nav">
  <button data-tab="lab" class="on"><svg class="ni"><use href="#i-hex"/></svg>Run Lab</button>
  <button data-tab="watch"><svg class="ni"><use href="#i-eye"/></svg>Watch</button>
  <button data-tab="metrics"><svg class="ni"><use href="#i-rule"/></svg>Metrics</button>
  <button data-tab="label"><svg class="ni"><use href="#i-tag"/></svg>Label</button>
  <button data-tab="archive"><svg class="ni"><use href="#i-box"/></svg>Archive</button>
  <button data-tab="guide"><svg class="ni"><use href="#i-compass"/></svg>Guide</button>
</nav>
<main>
  <section id="tab-lab"></section>
  <section id="tab-watch" hidden></section>
  <section id="tab-metrics" hidden></section>
  <section id="tab-label" hidden></section>
  <section id="tab-archive" hidden></section>
  <section id="tab-guide" hidden></section>
</main>
<footer>battery v1 frozen · rules and metrics are not knobs · keys never leave the server</footer>
</div>
<script src="/static/world.js"></script>
<script src="/static/md.js"></script>
<script src="/static/app.js"></script>
</body></html>
